<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Job Search & Shortlisting Agent – Mercan Bakirezen</title>
<style>
:root{--bg:#0e1013;--panel:#16191e;--panel2:#1d2127;--line:#2a2f37;--tx:#e4e6ea;--mu:#8b93a1;--ac:#c9a45c;--ok:#4cb782;--bad:#e5645b;--warn:#e0a64a;--blue:#6aa3e8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:inherit}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
header h1{font-size:22px}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:20px 24px;max-width:1400px;margin:auto}
@media(max-width:860px){.layout{grid-template-columns:1fr;padding:14px}}
aside{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.box h3{font-size:15px;margin-bottom:10px}
label.row{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer;color:var(--tx)}
input[type=text],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=checkbox]{accent-color:var(--ac)}
.btn{background:var(--ac);color:#17130a;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;border:1px solid var(--line);color:var(--mu);margin:0 4px 4px 0}
.badge.ok{color:var(--ok);border-color:#2c5a45}.badge.bad{color:var(--bad);border-color:#6b3430}.badge.warn{color:var(--warn);border-color:#6b5426}.badge.ac{color:var(--ac);border-color:#6b5a30}.badge.blue{color:var(--blue);border-color:#2f4a6e}
.statusbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;color:var(--mu)}
.stats b{display:block;font:600 22px Georgia,serif;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;display:flex;gap:12px}
.card:hover{border-color:var(--ac)}
.score{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:600 16px Georgia,serif;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel2) 0)}
.score span{width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.card h3{font-size:15px;line-height:1.3;margin-bottom:3px}.card .meta{color:var(--mu);font-size:13px;margin-bottom:6px}
#term{background:#08090b;border:1px solid var(--line);border-radius:8px;margin-top:20px;height:210px;overflow:auto;padding:10px 12px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace}
#term .t{color:#59616e}#term .ok{color:var(--ok)}#term .er{color:var(--bad)}#term .wa{color:var(--warn)}#term .in{color:var(--blue)}
.empty{padding:40px;text-align:center;color:var(--mu);border:1px dashed var(--line);border-radius:8px}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;max-width:720px;width:calc(100% - 28px);padding:22px;max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog ul{padding-left:18px;margin:6px 0 14px}dialog li{margin-bottom:4px}
.desc{max-height:170px;overflow:auto;background:var(--panel2);border-radius:6px;padding:10px;color:var(--mu);font-size:13px;white-space:pre-wrap}
.link{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Live AI Job Search &amp; Shortlisting Agent</h1>
    <p>Mercan Bakirezen · McKinsey EM · ÜNLÜ &amp; Co DCM · PwC TS · LSE MSc Finance</p>
  </div>
  <div class="statusbar" id="apiStatus"></div>
</header>

<div class="layout">
<aside>
  <div class="box">
    <h3>Add a company board</h3>
    <input type="text" id="slug" placeholder="Company slug, e.g. monzo" aria-label="Company slug">
    <select id="atsSel" aria-label="ATS"><option value="greenhouse">Greenhouse</option><option value="lever">Lever</option><option value="ashby">Ashby</option><option value="smartrecruiters">SmartRecruiters</option></select>
    <select id="indSel" aria-label="Industry group"></select>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="addBtn">Fetch live board</button><button class="btn ghost" id="reloadBtn">Re-run all</button><button class="btn ghost" id="clrBtn">Remove failed boards</button></div>
  </div>
  <div class="box"><h3>Industry group</h3><div id="fInd"></div></div>
  <div class="box"><h3>Geography</h3><div id="fGeo"></div></div>
  <div class="box">
    <h3>Visa &amp; regional edge</h3>
    <select id="fVisa" aria-label="Visa filter"><option value="all">All sponsorship statuses</option><option value="likely">Likely sponsor only</option><option value="unver">Unverified only</option></select>
    <label class="row"><input type="checkbox" id="fEEMEA"> Turkey / EEMEA / CEE advantage only</label>
    <label for="fMin" style="color:var(--mu)">Minimum match: <b id="minVal" style="color:var(--tx)">50</b>%</label>
    <input type="range" id="fMin" min="0" max="95" value="50">
    <input type="text" id="fQ" placeholder="Search title or company" aria-label="Search">
  </div>
</aside>

<main>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <h3 style="margin-top:22px">Agent execution log</h3>
  <div id="term" role="log" aria-live="polite"></div>
</main>
</div>

<dialog id="dlg"></dialog>

<script>
"use strict";
/* ---------- Configuration ---------- */
const INDUSTRIES=["Tech & Consumer","Fintech","Energy & Sustainability","Industrial & Auto","E-Commerce & Mobility","Strategy & ESG Consulting"];
const GEOS={UK:"United Kingdom",SE:"Sweden",ES:"Spain",NL:"Netherlands",DE:"Germany",EU:"Europe-wide / Remote"};
const GEO_RX={
 UK:/united kingdom|\buk\b|england|london|manchester|edinburgh|bristol|cambridge|scotland|glasgow|birmingham/i,
 SE:/sweden|stockholm|gothenburg|göteborg|malm[öo]/i,
 ES:/spain|madrid|barcelona|valencia|españa/i,
 NL:/netherlands|amsterdam|rotterdam|utrecht|the hague|eindhoven/i,
 DE:/germany|berlin|munich|münchen|hamburg|frankfurt|cologne|deutschland/i,
 EU:/europe|emea|\beu\b|european/i};
const VISA_REG={UK:"UK Skilled Worker",DE:"EU Blue Card (DE)",NL:"EU Blue Card / Kennismigrant (NL)",SE:"EU Blue Card (SE)",ES:"Spanish HQP / EU Blue Card",EU:"EU Blue Card"};
/* Curated starting list – boards that fail simply log a non-200 status. */
const I={TC:"Tech & Consumer",FI:"Fintech",EN:"Energy & Sustainability",IA:"Industrial & Auto",EM:"E-Commerce & Mobility",SC:"Strategy & ESG Consulting"};
const B=(ats,slug,name,ind,sp=1)=>({ats,slug,name,ind:I[ind],sponsor:!!sp});
/* Slugs marked "test" in the chat are best guesses: a wrong one shows a red 404 badge. */
let BOARDS=[
 B("greenhouse","stripe","Stripe","FI"),B("greenhouse","monzo","Monzo","FI"),B("greenhouse","gocardless","GoCardless","FI"),
 B("greenhouse","adyen","Adyen","FI"),B("greenhouse","wise","Wise","FI"),B("greenhouse","n26","N26","FI"),
 B("greenhouse","traderepublic","Trade Republic","FI"),B("greenhouse","bitpanda","Bitpanda","FI"),
 B("greenhouse","databricks","Databricks","TC"),B("greenhouse","anthropic","Anthropic","TC"),B("greenhouse","airbnb","Airbnb","TC"),
 B("greenhouse","celonis","Celonis","TC"),B("greenhouse","typeform","Typeform","TC",0),B("lever","spotify","Spotify","TC"),
 B("lever","palantir","Palantir","TC"),B("lever","mistral","Mistral AI","TC"),B("ashby","lovable","Lovable","TC",0),
 B("ashby","openai","OpenAI","TC"),B("ashby","elevenlabs","ElevenLabs","TC"),B("lever","dreamgames","Dream Games (Istanbul)","TC",0),
 B("greenhouse","deliveroo","Deliveroo","EM"),
 B("smartrecruiters","DeliveryHero","Delivery Hero","EM"),B("smartrecruiters","BoschGroup","Bosch","IA"),
 B("smartrecruiters","IKEA","IKEA","TC"),B("smartrecruiters","Ubisoft2","Ubisoft","TC")
];
const CUSTOM_KEY="mb_custom_boards";
try{JSON.parse(localStorage.getItem(CUSTOM_KEY)||"[]").forEach(b=>{if(!BOARDS.some(x=>x.slug===b.slug&&x.ats===b.ats))BOARDS.push(b)})}catch(e){}
function saveCustom(){try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(BOARDS.filter(b=>b.custom)))}catch(e){}}
const ATSN={greenhouse:"Greenhouse",lever:"Lever",ashby:"Ashby",smartrecruiters:"SmartRecruiters"};
/* ---------- Scoring engine ---------- */
const T1=/chief of staff|corporate development|corp(orate)? dev|\bm&a\b|mergers|acquisitions|corporate strategy|strategy (&|and) (operations|ops|planning)|bizops|business operations|biz ops/i;
const T2=/strategy|strategic (planning|initiatives|projects|programs|finance|operations)|transformation|sustainab|\besg\b|decarbon|climate|net.?zero|capital markets|treasury|investor relations|corporate finance|business planning|special projects/i;
const TBAD=/engineer|developer|designer|recruit|support|account (executive|manager|director)|sales|marketing|counsel|paralegal|scientist|solutions|pre-?sales|customer success|lead generation|demand gen|\bsdr\b|\bbdr\b|audit|analyst|intern|graduate|junior|coordinator|assistant|associate/i;
const SENIOR=/director|head of|\bvp\b|vice president|principal|lead|senior|manager|chief/i;
const EEMEA=/turk|türkiye|istanbul|eemea|\bcee\b|central (and|&) eastern|emerging market|middle east|\bmena\b|\bcis\b/i;
const SIGNALS=[
 [/due diligence|\bm&a\b|acquisition|post.?merger|integration/i,"M&A and due-diligence scope maps to PwC Transaction Services and ÜNLÜ advisory mandates"],
 [/capital markets|debt|financing|fundrais|treasury|investor/i,"Financing / capital-markets content aligns with Debt Capital Markets experience at ÜNLÜ & Co"],
 [/consult|mckinsey|problem.solv|structured|engagement|c-suite|executive stakeholder/i,"Consulting-grade problem solving and C-suite engagement mirror 8+ years as McKinsey Engagement Manager"],
 [/\besg\b|sustainab|climate|decarbon|net.?zero|csrd|energy transition/i,"ESG / sustainability transformation scope fits Mercan's ESG and transformation work"],
 [/fintech|payments|banking|financial services|lending|financial model/i,"Financial-services and modelling context leverages the LSE MSc Finance and banking background"],
 [/transformation|operating model|portfolio|okr|performance management|pmo|cross-functional/i,"Operating-model and cross-functional programme leadership matches engagement-manager delivery"]];
const stripHtml=h=>{let t=h||"";for(let i=0;i<2;i++){t=new DOMParser().parseFromString(t,"text/html").body.textContent||""}return t.replace(/\s+/g," ").trim()};
function geoOf(loc){const s=new Set();for(const k in GEO_RX)if(GEO_RX[k].test(loc))s.add(k);return[...s]}
function scoreJob(j){
 const why=[];let s=25;
 if(T1.test(j.title)){s+=40;why.push("Title is a core target role (Strategy / BizOps / Chief of Staff / M&A / Corp Dev)")}
 else if(T2.test(j.title)){s+=26;why.push("Title sits in an adjacent target family (strategy, transformation, ESG, finance)")}
 if(SENIOR.test(j.title)){s+=8;why.push("Seniority level is consistent with an Engagement Manager–level executive")}
 let hits=0;const txt=j.title+" "+j.desc;
 for(const[rx,msg]of SIGNALS){if(rx.test(txt)&&hits<5){hits++;s+=5;why.push(msg)}}
 if(j.eemea){s+=8;why.push("Touches Turkey / EEMEA / CEE – Istanbul market depth is a differentiator")}
 if(!j.eemea&&j.geo.length&&!j.geo.includes("UK")&&!j.geo.includes("EU")===false){}
 return{score:Math.min(98,s),why}
}
/* ---------- State & logging ---------- */
let JOBS=[],STATUS={};
const term=document.getElementById("term");
const now=()=>new Date().toLocaleTimeString("en-GB");
function log(msg,cls=""){const d=document.createElement("div");d.innerHTML=`<span class="t">[${now()}]</span> <span class="${cls}"></span>`;d.lastChild.textContent=msg;term.appendChild(d);term.scrollTop=term.scrollHeight}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Live ATS fetch ---------- */
const endpoint=b=>b.ats==="greenhouse"?`https://boards-api.greenhouse.io/v1/boards/${encodeURIComponent(b.slug)}/jobs?content=true`:b.ats==="smartrecruiters"?`https://api.smartrecruiters.com/v1/companies/${encodeURIComponent(b.slug)}/postings?limit=100`:b.ats==="ashby"?`https://api.ashbyhq.com/posting-api/job-board/${encodeURIComponent(b.slug)}`:`https://api.lever.co/v0/postings/${encodeURIComponent(b.slug)}?mode=json`;
function normalise(b,raw){
 if(b.ats==="greenhouse")return{id:"gh"+raw.id,title:raw.title||"",loc:(raw.location&&raw.location.name)||"",url:raw.absolute_url,desc:stripHtml(raw.content),team:(raw.departments&&raw.departments[0]&&raw.departments[0].name)||""};
 if(b.ats==="smartrecruiters"){const L=raw.location||{},C={gb:"United Kingdom",de:"Germany",se:"Sweden",es:"Spain",nl:"Netherlands"};return{id:"sr"+raw.id,title:raw.name||"",loc:[L.city,L.region,C[(L.country||"").toLowerCase()]||(L.country||"").toUpperCase()].filter(Boolean).join(", ")+(L.remote?" ; Remote":""),url:"https://jobs.smartrecruiters.com/"+encodeURIComponent(b.slug)+"/"+raw.id,desc:"",team:(raw.department&&raw.department.label)||""}}
 if(b.ats==="ashby")return{id:"ab"+raw.id,title:raw.title||"",loc:[raw.location].concat((raw.secondaryLocations||[]).map(x=>x.location)).filter(Boolean).join("; ")+(raw.isRemote?" ; Remote":""),url:raw.jobUrl,desc:raw.descriptionPlain||stripHtml(raw.descriptionHtml),team:raw.department||"",unlisted:raw.isListed===false};
 return{id:"lv"+raw.id,title:raw.text||"",loc:(raw.categories&&(raw.categories.allLocations||[raw.categories.location]).filter(Boolean).join("; "))||"",url:raw.hostedUrl,desc:raw.descriptionPlain||stripHtml(raw.description),team:(raw.categories&&raw.categories.team)||""}
}
async function srAll(b,first){let all=first.content||[],tot=first.totalFound||all.length;while(all.length<tot&&all.length<600){const r=await fetch(endpoint(b)+"&offset="+all.length);if(!r.ok)break;const d=await r.json();if(!d.content||!d.content.length)break;all=all.concat(d.content)}return all}
async function loadBoard(b,tried){
 tried=tried||[b.ats];
 const url=endpoint(b),t0=performance.now();
 log(`GET ${url}`,"in");STATUS[b.slug]={state:"loading"};renderStatus();
 try{
  const r=await fetch(url,{headers:{Accept:"application/json"}});
  const ms=Math.round(performance.now()-t0);
  if(r.status===404){const nx=["greenhouse","lever","ashby","smartrecruiters"].find(a=>!tried.includes(a));if(nx){log(`  ← HTTP 404 on ${ATSN[b.ats]} – retrying ${b.slug} on ${ATSN[nx]}`,"wa");b.ats=nx;return loadBoard(b,tried.concat(nx))}}
  if(!r.ok){log(`  ← HTTP ${r.status} ${b.name} (${ms} ms) – check the slug`,"er");STATUS[b.slug]={state:"bad",code:r.status};renderStatus();return}
  const data=await r.json();
  if(b.ats==="smartrecruiters"&&!(data.totalFound>0)){log(`  ← ${b.name}: no postings found on SmartRecruiters (check the company identifier, it is case-sensitive)`,"er");STATUS[b.slug]={state:"bad",code:404};renderStatus();return}
  const list=b.ats==="lever"?data:b.ats==="smartrecruiters"?await srAll(b,data):data.jobs;
  log(`  ← HTTP 200 ${b.name}: ${list.length} postings (${ms} ms)`,"ok");
  let geoKeep=0,geoDrop=0,roleDrop=0,kept=0;
  JOBS=JOBS.filter(j=>j.board!==b.slug);
  for(const raw of list){
   const n=normalise(b,raw);if(n.unlisted)continue;
   n.geo=geoOf(n.loc);
   if(!n.geo.length){geoDrop++;continue}
   geoKeep++;
   if(TBAD.test(n.title)||!(T1.test(n.title)||T2.test(n.title))){roleDrop++;continue}
   if(b.ats==="smartrecruiters"){try{const d=await(await fetch("https://api.smartrecruiters.com/v1/companies/"+encodeURIComponent(b.slug)+"/postings/"+raw.id)).json();n.desc=stripHtml(Object.values((d.jobAd&&d.jobAd.sections)||{}).map(x=>x.text||"").join(" "));if(d.postingUrl)n.url=d.postingUrl}catch(e){}}
   n.eemea=EEMEA.test(n.title+" "+n.loc+" "+n.desc);
   const sc=scoreJob(n);Object.assign(n,sc,{board:b.slug,company:b.name,ind:b.ind,sponsor:b.sponsor,ats:b.ats});
   JOBS.push(n);kept++;
  }
  log(`  parse: ${geoDrop} discarded (non-target geography: NA/LatAm/APAC/other), ${roleDrop} off-profile roles, ${kept} shortlisted`,kept?"ok":"wa");
  STATUS[b.slug]={state:"ok",count:kept};
 }catch(e){
  log(`  ✕ ${b.name}: ${e.message} (request blocked: hosted artifact pages cannot call external ATS APIs; run the downloaded file in a desktop browser for live data)`,"er");STATUS[b.slug]={state:"bad",code:"ERR"};
 }
 renderStatus();render();
}
async function runAll(){log(`Agent started · ${BOARDS.length} boards · target: UK, SE, ES, NL, DE, Europe remote`,"wa");await Promise.all(BOARDS.map(loadBoard));log("Run complete.","ok")}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function renderStatus(){$("apiStatus").innerHTML=BOARDS.map(b=>{const s=STATUS[b.slug]||{};const c=s.state==="ok"?"ok":s.state==="bad"?"bad":"warn";const t=s.state==="ok"?s.count:s.state==="bad"?s.code:"…";return`<span class="badge ${c}">${esc(b.name)} · ${t}</span>`}).join("")}
function buildFilters(){
 $("fInd").innerHTML=INDUSTRIES.map(i=>`<label class="row"><input type="checkbox" data-ind value="${esc(i)}" checked> ${esc(i)}</label>`).join("");
 $("fGeo").innerHTML=Object.entries(GEOS).map(([k,v])=>`<label class="row"><input type="checkbox" data-geo value="${k}" checked> ${v}</label>`).join("");
 $("indSel").innerHTML=INDUSTRIES.map(i=>`<option>${esc(i)}</option>`).join("");
 document.querySelectorAll("aside input,aside select").forEach(e=>e.addEventListener("input",render));
}
function visaInfo(j){
 if(!j.sponsor)return{label:"Unverified – check register",cls:"warn",regs:[]};
 return{label:"Likely sponsor",cls:"ok",regs:[...new Set(j.geo.map(g=>VISA_REG[g]))]};
}
function filtered(){
 const inds=[...document.querySelectorAll("[data-ind]:checked")].map(e=>e.value);
 const geos=[...document.querySelectorAll("[data-geo]:checked")].map(e=>e.value);
 const min=+$("fMin").value,q=$("fQ").value.toLowerCase(),v=$("fVisa").value,ee=$("fEEMEA").checked;
 $("minVal").textContent=min;
 return JOBS.filter(j=>inds.includes(j.ind)&&j.geo.some(g=>geos.includes(g))&&j.score>=min&&(!ee||j.eemea)&&(!q||(j.title+j.company).toLowerCase().includes(q))&&(v==="all"||(v==="likely")===!!j.sponsor)).sort((a,b)=>b.score-a.score);
}
const col=s=>s>=80?"var(--ok)":s>=65?"var(--ac)":"var(--warn)";
function render(){
 const L=filtered();
 $("stats").innerHTML=`<div><b>${L.length}</b>shortlisted</div><div><b>${JOBS.length}</b>region-matched roles</div><div><b>${L.filter(j=>j.eemea).length}</b>EEMEA edge</div><div><b>${L.length?L[0].score+"%":"–"}</b>top match</div>`;
 $("grid").innerHTML=L.length?L.map(j=>{const v=visaInfo(j);return`<div class="card" tabindex="0" role="button" data-id="${j.id}">
  <div class="score" style="--p:${j.score};--c:${col(j.score)}"><span>${j.score}%</span></div>
  <div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)} · ${esc(j.loc)||"Location n/a"}</div>
  <span class="badge ${v.cls}">${v.label}</span>${j.eemea?'<span class="badge ac">Turkey / EEMEA edge</span>':""}<span class="badge">${esc(j.ind)}</span></div></div>`}).join(""):
  `<div class="empty" style="grid-column:1/-1">${JOBS.length?"No roles match these filters. Lower the minimum match or widen the geography.":"No live postings loaded yet. Check the execution log below, or add a company slug."}</div>`;
}
function openJob(id){
 const j=JOBS.find(x=>x.id===id),v=visaInfo(j),d=$("dlg");
 d.innerHTML=`<h2>${esc(j.title)}</h2>
 <p style="color:var(--mu);margin:4px 0 10px">${esc(j.company)} · ${esc(j.loc)} · via ${ATSN[j.ats]}${j.team?" · "+esc(j.team):""}</p>
 <span class="badge ac">Match ${j.score}%</span><span class="badge ${v.cls}">${v.label}</span>${v.regs.map(r=>`<span class="badge blue">${esc(r)}</span>`).join("")}${j.eemea?'<span class="badge ac">Turkey / EEMEA edge</span>':""}
 <h3 style="margin-top:12px">Why Mercan fits</h3><ul>${j.why.map(w=>`<li>${esc(w)}</li>`).join("")||"<li>Title-level match only; review the description.</li>"}</ul>
 <h3>Posting excerpt</h3><div class="desc">${esc(j.desc.slice(0,1800))}${j.desc.length>1800?"…":""}</div>
 <p style="color:var(--mu);font-size:12px">Sponsorship status is a curated indicator, not a live register lookup. Confirm on the <a class="link" target="_blank" rel="noopener" href="https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers">UK sponsor register</a> or the employer's careers page before applying.</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="closeDlg">Close</button><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(j.url)}">Apply on ${ATSN[j.ats]}</a></div>`;
 d.showModal();$("closeDlg").onclick=()=>d.close();
}
$("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openJob(c.dataset.id)});
$("grid").addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest(".card");if(c)openJob(c.dataset.id)}});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("addBtn").onclick=()=>{
 const slug=$("slug").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
 if(!slug){log("Enter a company slug first (the token in the careers-page URL).","wa");return}
 let b=BOARDS.find(x=>x.slug===slug&&x.ats===$("atsSel").value);
 if(!b){b={slug,ats:$("atsSel").value,name:slug.charAt(0).toUpperCase()+slug.slice(1),ind:$("indSel").value,sponsor:false,custom:true};BOARDS.push(b);saveCustom()}
 $("slug").value="";loadBoard(b);
};
$("slug").addEventListener("keydown",e=>{if(e.key==="Enter")$("addBtn").click()});
$("reloadBtn").onclick=()=>{JOBS=[];render();runAll()};
$("clrBtn").onclick=()=>{const n=BOARDS.length;BOARDS=BOARDS.filter(b=>!(STATUS[b.slug]&&STATUS[b.slug].state==="bad"));saveCustom();log(`Removed ${n-BOARDS.length} failed boards.`,"wa");renderStatus()};
buildFilters();renderStatus();render();runAll();
</script>
</body>
</html>
